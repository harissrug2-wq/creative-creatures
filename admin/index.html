<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agencies · Creative Creatures Admin</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="admin-app">
    <aside class="admin-side">
      <div class="admin-brand">
        <img src="/portal/creative-creatures-logo.png" alt="Creative Creatures">
        <div class="admin-badge">
          <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg>Admin Console
        </div>
      </div>
      <nav class="admin-nav">
        <a class="admin-link active" href="/admin/">
          <svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="14" rx="1"/><path d="M9 7V3h6v4M9 11v6M15 11v6M6 14h12"/></svg>Agencies
        </a>
        <a class="admin-link" href="/admin/performance/">
          <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19V2"/></svg>Performance
        </a>
      </nav>
      <div class="admin-profile">
        <span class="admin-avatar">PA</span>
        <div>
          <strong>Platform Admin</strong>
          <span>admin@creativecreatures.org</span>
        </div>
        <i>⌃</i>
      </div>
    </aside>
    <div class="admin-overlay"></div>
    <div class="admin-main">
      <header class="admin-top">
        <button class="admin-mobile">☰</button>
        <span>Creative Creatures</span>&nbsp;/&nbsp;Admin
      </header>
      <main class="admin-content">
        <header class="admin-head">
          <div>
            <h1>Agencies</h1>
            <p>All agency tenants on the platform. Click a card to manage, or peek at high-level stats at a glance.</p>
          </div>
          <button class="admin-primary" data-new-agency>＋ New Agency</button>
        </header>

        <section class="admin-grid" id="agencyGrid">
          <!-- Dynamically populated by admin.js -->
        </section>
      </main>
    </div>
  </div>

  <!-- New Agency Modal -->
  <div class="admin-modal" id="newAgencyModal">
    <div class="admin-dialog">
      <h2>Add New Agency Tenant</h2>
      <form id="newAgencyForm">
        <input type="text" id="newAgencyName" placeholder="Agency Name (e.g. Directing Design)" required>
        <input type="email" id="newAgencyEmail" placeholder="Owner Email (e.g. owner@directingdesign.com)" required>
        <input type="text" id="newAgencyWebsite" placeholder="Agency Website (e.g. directingdesign.com)" required>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <select id="newAgencyPlan" class="sortbox" style="width:100%;margin-bottom:12px;">
            <option value="Starter">Starter Plan</option>
            <option value="Growth" selected>Growth Plan</option>
            <option value="Scale">Scale Plan</option>
          </select>
          <input type="number" id="newAgencyMRR" placeholder="MRR ($)" value="5000" style="margin-bottom:12px;">
        </div>
        <div class="dialog-actions">
          <button type="button" class="mini-btn" data-close-modal>Cancel</button>
          <button type="submit" class="mini-btn primary">Create Agency</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
