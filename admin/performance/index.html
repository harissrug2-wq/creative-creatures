<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Platform Performance · Creative Creatures Admin</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div class="admin-app">
    <aside class="admin-side">
      <div class="admin-brand">
        <img src="/portal/creative-creatures-logo.png" alt="Creative Creatures">
        <div class="admin-badge">
          <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg>Admin Console
        </div>
      </div>
      <nav class="admin-nav">
        <a class="admin-link" href="/admin/">
          <svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="14" rx="1"/><path d="M9 7V3h6v4M9 11v6M15 11v6M6 14h12"/></svg>Agencies
        </a>
        <a class="admin-link active" href="/admin/performance/">
          <svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19V2"/></svg>Performance
        </a>
      </nav>
      <div class="admin-profile">
        <span class="admin-avatar">PA</span>
        <div>
          <strong>Platform Admin</strong>
          <span>admin@creativecreatures.org</span>
        </div>
        <i>⌃</i>
      </div>
    </aside>

    <div class="admin-overlay"></div>

    <div class="admin-main">
      <header class="admin-top">
        <button class="admin-mobile">☰</button>
        <span>Creative Creatures</span>&nbsp;/&nbsp;Admin&nbsp;/&nbsp;Performance
      </header>

      <main class="admin-content">
        <header class="admin-head">
          <div>
            <h1>Platform Performance</h1>
            <p>Rolled-up view across every agency on the platform. Drill into any tenant to inspect their dashboards.</p>
          </div>
        </header>

        <!-- Dynamic metric cards grid -->
        <section class="metric-grid" id="metricGrid">
          <!-- Dynamically populated by admin.js -->
        </section>

        <div class="rollup-head">
          <h2>Per-agency rollup</h2>
          <div class="rollup-tools">
            <input class="searchbox" id="agencySearch" placeholder="⌕  Search agency...">
            <select class="sortbox" id="agencySort">
              <option value="mrr-desc">Sort: MRR ↓</option>
              <option value="health-desc">Sort: Health ↓</option>
              <option value="name-asc">Sort: Name A-Z</option>
              <option value="accounts-desc">Sort: Accounts ↓</option>
              <option value="date-desc">Sort: Date Newest</option>
            </select>
          </div>
        </div>

        <!-- Dynamic Rollup Table -->
        <section class="rollup-table" id="rollupTableContainer">
          <!-- Dynamically populated by admin.js -->
        </section>
      </main>
    </div>
  </div>

  <script src="/admin/admin.js"></script>
</body>
</html>
