<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Sign In · Creative Creatures</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/admin/admin.css"></head>
<body class="admin-login-page"><main class="admin-login-shell"><section class="admin-login-card"><img src="/portal/creative-creatures-logo.png" alt="Creative Creatures" class="admin-login-logo"><span class="admin-login-eyebrow">Admin Console</span><h1>Creative Creatures Admin</h1><p>Sign in with your Creative Creatures administrator credentials.</p><form id="adminLoginForm"><label>Username<input id="adminUsername" autocomplete="username" required></label><label>Password<input id="adminPassword" type="password" autocomplete="current-password" required></label><div class="admin-login-error" id="adminLoginError"></div><button class="admin-primary admin-login-submit" type="submit">Sign in →</button></form></section></main><script>(()=>{const form=document.getElementById('adminLoginForm'),error=document.getElementById('adminLoginError');fetch('/api/admin-auth',{cache:'no-store'}).then(r=>{if(r.ok){const next=new URLSearchParams(location.search).get('next')||'/admin/';location.replace(next)}}).catch(()=>{});form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const btn=form.querySelector('button');btn.disabled=true;btn.textContent='Signing in…';try{const r=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('adminUsername').value,password:document.getElementById('adminPassword').value})});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'Sign in failed.');const next=new URLSearchParams(location.search).get('next')||'/admin/';location.replace(next)}catch(err){error.textContent=err.message}finally{btn.disabled=false;btn.textContent='Sign in →'}})})();</script></body></html>
