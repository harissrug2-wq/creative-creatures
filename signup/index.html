<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Start your journey · Creative Creatures</title>
  <meta name="theme-color" content="#f8f8f6">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/portal/base.css">
  <link rel="stylesheet" href="/portal/signup.css">
</head>
<body class="journey-choice-page">
  <div class="journey-choice-glow" aria-hidden="true"></div>
  <main class="journey-choice-shell">
    <header class="journey-choice-top">
      <a href="/login/" class="journey-choice-logo"><img src="/portal/creative-creatures-logo.png" alt="Creative Creatures"></a>
      <a href="/login/" class="journey-choice-signin">Sign in</a>
    </header>

    <section class="journey-choice-hero">
      <h1>Choose how you want to work<br>on your agency</h1>
      <p>Every path runs the same evidence-based diagnostic. Pick the format that<br class="desktop-break"> fits you — privately with our team, alongside a cohort of peer owners, or<br class="desktop-break"> straight through to the platform.</p>
    </section>

    <section class="journey-choice-grid" aria-label="Choose your journey">
      <button type="button" class="journey-option" data-destination="diagnostic" aria-pressed="false">
        <span class="journey-icon blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 18V8M5 18h14"/><path d="m8 15 3-4 3 2 4-6"/></svg></span>
        <span class="popular-pill">Most popular</span>
        <h2>Agency Diagnostic</h2><div class="journey-price">$6,800 · PER AGENCY · ONE-TIME</div>
        <p class="journey-description">A private, 14-day look under the hood of your agency.</p>
        <ul><li><i class="blue-check">✓</i><span>Owner archetype + team &amp; leadership review</span></li><li><i class="blue-check">✓</i><span>14-point risk assessment and valuation</span></li><li><i class="blue-check">✓</i><span>Back office systems performance analysis</span></li><li><i class="blue-check">✓</i><span>90-day + 1-year strategic roadmap</span></li></ul>
        <span class="choose-path">Choose this path</span>
      </button>

      <button type="button" class="journey-option temporarily-locked" data-destination="accelerator" aria-pressed="false" aria-disabled="true">
        <span class="journey-icon orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3.5 19v-2.2A4.8 4.8 0 0 1 8.3 12h1.4a4.8 4.8 0 0 1 4.8 4.8V19"/><path d="M17 7a3 3 0 0 1 0 6M18 19v-2a4.5 4.5 0 0 0-2.5-4"/></svg></span>
        <span class="temporary-lock-pill">Temporarily locked</span><h2>Breakthrough Accelerator</h2><div class="journey-price">$4,500 · PER PERSON · 90 DAYS</div>
        <p class="journey-description">The same diagnostic in a 90-day peer cohort.</p>
        <ul><li><i class="orange-check">✓</i><span>Owner archetype + team &amp; leadership review</span></li><li><i class="orange-check">✓</i><span>14-point risk assessment and valuation</span></li><li><i class="orange-check">✓</i><span>Back office systems performance analysis</span></li><li><i class="orange-check">✓</i><span>90-day + 1-year strategic roadmap</span></li></ul>
        <span class="choose-path">Choose this path</span>
      </button>

      <button type="button" class="journey-option portal-option temporarily-locked" data-destination="platform" aria-pressed="false" aria-disabled="true">
        <span class="journey-icon purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg></span>
        <span class="temporary-lock-pill">Temporarily locked</span><h2>Platform &amp; Partner Portal</h2><div class="journey-price">UNLOCKS AFTER THE DIAGNOSTIC</div>
        <p class="journey-description">Run the plan day to day — goals, rocks, weekly L10s, and live KPIs across every department.</p>
        <ul><li><i class="purple-check">✓</i><span>Full agency workspace + department dashboards</span></li><li><i class="purple-check">✓</i><span>Annual goals cascaded to quarters and weeks</span></li><li><i class="purple-check">✓</i><span>Weekly L10 cadence with auto agendas</span></li><li><i class="purple-check">✓</i><span>Back office integrations &amp; intelligence layer</span></li></ul>
        <div class="portal-lock-note"><span>♙</span><span>Starts with the Agency Diagnostic — it produces the scorecard the portal runs on.</span></div>
        <span class="choose-path">Choose this path</span>
      </button>
    </section>

    <footer class="journey-choice-footer">
      <div>Not ready yet? <a href="/owner-archetype/">Start with the free Owner Archetype report</a></div>
      <button type="button" class="journey-continue" id="journeyContinue" disabled>Continue <span>→</span></button>
    </footer>
  </main>

  <script>
  (()=>{let selected='';const cards=[...document.querySelectorAll('.journey-option')],continueBtn=document.getElementById('journeyContinue');const select=card=>{if(card.classList.contains('temporarily-locked'))return;selected=card.dataset.destination;cards.forEach(item=>{const active=item===card;item.classList.toggle('selected',active);item.setAttribute('aria-pressed',String(active))});continueBtn.disabled=false};cards.forEach(card=>card.addEventListener('click',()=>select(card)));continueBtn.addEventListener('click',()=>{if(selected!=='diagnostic')return;localStorage.setItem('ccProgramPath','diagnostic');location.href='/signup/lookup/?destination=diagnostic'})})();
  </script>
</body>
</html>
