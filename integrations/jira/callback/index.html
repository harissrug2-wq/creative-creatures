<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connecting Jira</title><style>body{font-family:Inter,system-ui;background:#f6f7fb;display:grid;place-items:center;min-height:100vh;margin:0;color:#171923}.card{background:#fff;border:1px solid #dde2ea;border-radius:20px;padding:32px;max-width:520px;box-shadow:0 18px 50px #18223b1a}h1{margin-top:0}.error{color:#b42318}</style></head><body><main class="card"><h1>Connecting Jira…</h1><p id="message">Finishing the secure Atlassian authorization.</p></main><script>(async()=>{const p=new URLSearchParams(location.search),m=document.querySelector('#message');try{if(p.get('error'))throw new Error(p.get('error_description')||p.get('error'));const r=await fetch('/api/account-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'jira_callback',code:p.get('code'),state:p.get('state')})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Jira connection failed.');location.replace('/integrations/?jira=connected')}catch(e){m.className='error';m.textContent=e.message}})()</script></body></html>
