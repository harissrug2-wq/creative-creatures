<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connecting monday.com - Creative Creatures</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/portal/base.css"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fafaf8;color:#171b22;font-family:Inter,Arial,sans-serif}.card{width:min(520px,calc(100% - 32px));background:#fff;border:1px solid #e4e4df;border-radius:20px;padding:34px;box-shadow:0 18px 60px rgba(23,27,34,.08);text-align:center}.mark{width:58px;height:58px;border-radius:16px;background:#fff0f3;color:#ff3d57;display:grid;place-items:center;margin:0 auto 18px;font-weight:900;font-size:21px}.spinner{width:28px;height:28px;border-radius:50%;border:3px solid #e8e9ef;border-top-color:#ff3d57;margin:22px auto 0;animation:spin .8s linear infinite}.error{color:#a63333;font-size:13px;line-height:1.5;margin-top:14px}.button{display:none;margin:18px auto 0;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#272cf3;color:#fff;font-weight:700;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main class="card"><div class="mark">Mo</div><h1 style="font-size:25px;margin:0 0 8px">Connecting monday.com...</h1><p style="margin:0;color:#697487;font-size:14px">We are securely linking the authorized monday.com account to Creative Creatures.</p><div class="spinner" id="spinner"></div><div class="error" id="error"></div><button class="button" id="back">Back to Integrations</button></main><script>(async()=>{const p=new URLSearchParams(location.search),code=p.get('code')||'',state=p.get('state')||'',status=p.get('status')||'',oauthError=p.get('error')||'',e=document.querySelector('#error'),s=document.querySelector('#spinner'),b=document.querySelector('#back'),fail=m=>{s.style.display='none';e.textContent=m;b.style.display='inline-flex'};b.onclick=()=>location.href='/integrations/';if(oauthError||status==='not_approved')return fail('monday.com connection was cancelled or not approved.');if(!code||!state)return fail('monday.com did not return the required authorization information.');try{const r=await fetch('/api/account-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'monday_callback',code,state})}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Unable to connect monday.com.');location.replace('/integrations/?monday=connected')}catch(x){fail(x.message||'Unable to connect monday.com.')}})();</script></body></html>
