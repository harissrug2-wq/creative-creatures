<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connecting FreshBooks · Creative Creatures</title>
  <link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/portal/base.css">
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fafaf8;color:#171b22;font-family:Inter,Arial,sans-serif}.card{width:min(520px,calc(100% - 32px));background:#fff;border:1px solid #e4e4df;border-radius:20px;padding:34px;box-shadow:0 18px 60px rgba(23,27,34,.08);text-align:center}.mark{width:58px;height:58px;border-radius:16px;background:#eaf4ff;color:#0075dd;display:grid;place-items:center;margin:0 auto 18px;font-weight:900;font-size:24px}.spinner{width:28px;height:28px;border-radius:50%;border:3px solid #e8e9ef;border-top-color:#0075dd;margin:22px auto 0;animation:spin .8s linear infinite}.error{color:#a63333;font-size:13px;line-height:1.5;margin-top:14px}.button{display:none;margin:18px auto 0;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:#272cf3;color:#fff;font-weight:700;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}</style>
</head>
<body>
  <main class="card"><div class="mark">Fb</div><h1 style="font-size:25px;margin:0 0 8px">Connecting FreshBooks…</h1><p style="margin:0;color:#697487;font-size:14px">We’re securely linking the authorized FreshBooks businesses to the signed-in Creative Creatures account.</p><div class="spinner" id="spinner"></div><div class="error" id="error"></div><button class="button" id="back">Back to Integrations</button></main>
  <script>(async()=>{const params=new URLSearchParams(location.search),code=params.get('code')||'',state=params.get('state')||'',oauthError=params.get('error')||'',errorDescription=params.get('error_description')||'',errorEl=document.querySelector('#error'),spinner=document.querySelector('#spinner'),back=document.querySelector('#back');const fail=message=>{spinner.style.display='none';errorEl.textContent=message;back.style.display='inline-flex'};back.onclick=()=>location.href='/integrations/';if(oauthError)return fail(oauthError==='access_denied'?'FreshBooks connection was cancelled.':errorDescription||`FreshBooks authorization failed: ${oauthError}`);if(!code||!state)return fail('FreshBooks did not return the required authorization information.');try{const response=await fetch('/api/account-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'freshbooks_callback',code,state})});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'Unable to connect FreshBooks.');location.replace('/integrations/?freshbooks=connected')}catch(error){fail(error.message||'Unable to connect FreshBooks.')}})();</script>
</body></html>
