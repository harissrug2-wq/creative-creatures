<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connecting QuickBooks · Creative Creatures</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/portal/base.css">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fafaf8;color:#151820;font-family:Inter,system-ui,sans-serif}.card{width:min(520px,calc(100% - 32px));background:#fff;border:1px solid #e4e4df;border-radius:20px;padding:34px;text-align:center;box-shadow:0 18px 60px rgba(22,26,36,.08)}.mark{width:54px;height:54px;margin:0 auto 18px;border-radius:16px;background:#eef0ff;display:grid;place-items:center;color:#272cf3;font-weight:900;font-size:24px}.spin{width:24px;height:24px;border:3px solid #dfe1ff;border-top-color:#272cf3;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}.error{color:#a92d2d;background:#fff4f4;border:1px solid #f2cece;padding:12px;border-radius:10px;font-size:13px;display:none}.error.show{display:block}.button{display:none;margin:18px auto 0;text-decoration:none;background:#272cf3;color:#fff;font-weight:700;padding:12px 18px;border-radius:10px;width:max-content}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">Q</div>
    <h1>Connecting QuickBooks</h1>
    <p id="status">Securely completing your QuickBooks authorization…</p>
    <div class="spin" id="spinner"></div>
    <div class="error" id="error"></div>
    <a class="button" id="back" href="/integrations/">Back to Integrations</a>
  </main>
  <script>
    (async()=>{
      const params=new URLSearchParams(location.search);
      const error=params.get('error');
      const errorDescription=params.get('error_description');
      const code=params.get('code');
      const realmId=params.get('realmId');
      const state=params.get('state');
      const status=document.querySelector('#status');
      const spinner=document.querySelector('#spinner');
      const errorBox=document.querySelector('#error');
      const back=document.querySelector('#back');
      const fail=message=>{status.textContent='QuickBooks was not connected.';spinner.style.display='none';errorBox.textContent=message;errorBox.classList.add('show');back.style.display='block';};
      if(error)return fail(errorDescription||error);
      if(!code||!realmId||!state)return fail('Intuit did not return all required authorization values. Please try connecting again.');
      try{
        const response=await fetch('/api/account-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'quickbooks_callback',code,realmId,state})});
        const payload=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(payload.error||'QuickBooks authorization could not be completed.');
        status.textContent='QuickBooks connected. Returning to Integrations…';
        location.replace('/integrations/?quickbooks=connected');
      }catch(err){fail(err.message||'QuickBooks authorization could not be completed.');}
    })();
  </script>
</body>
</html>
