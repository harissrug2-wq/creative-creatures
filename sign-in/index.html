<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In · Creative Creatures</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/onboarding.css"></head><body><main class="signin"><img src="/monitor/creative-creatures-logo.png" alt="Creative Creatures"><h1>Sign in</h1><p>Continue from the last completed step in your Agency Diagnostic.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="button primary full" id="signin">Sign in →</button><div class="signin-note">Authentication and multi-tenant account security require the production backend.</div></main><script>document.querySelector('#signin').onclick=()=>{const email=document.querySelector('#email').value.trim();if(!email){document.querySelector('#email').focus();return}localStorage.setItem('ccSignedIn','true');localStorage.setItem('ccOwnerEmail',email);const paid=localStorage.getItem('ccPaymentComplete')==='true'||localStorage.getItem('agencyPaymentComplete')==='true';const next=!paid?'/payment/':localStorage.getItem('agencyIntegrationsComplete')!=='true'?'/integrations/':'/diagnostic/';location.href=next;};</script></body></html>
